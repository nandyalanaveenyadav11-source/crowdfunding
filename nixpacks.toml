[phases.build]
cmds = ["composer install --no-dev", "npm install", "npm run build", "php artisan migrate --force", "php artisan db:seed --force", "php artisan config:clear", "php artisan event:clear", "php artisan route:clear", "php artisan view:clear"]

[phases.setup]
nixPkgs = ["...", "php82", "php82Packages.composer", "nodejs"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
